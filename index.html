  <meta property="og:description" content="Watch YouTube videos without ads, comments, or distractions. Search or paste a link and just focus." />

  <meta name="twitter:description" content="Watch YouTube videos without ads, comments, or distractions. Search or paste a link and just focus." />

  <style>
    /* ===================
       Colors palette — editorial, NYT-inspired.
    ====================== */
    :root {
      --bg-light: #ffffff;
      --bg-dark: #0a0a0a;
      --text-light: #121212;
      --text-dark: #e5e5e5;
      --text-secondary-light: #5b6472;
      --text-secondary-dark: #9a9a9a;
      --hairline-light: #dcdcdc;
      --hairline-dark: #2a2a2a;
      --accent-light: #15803d;
      --accent-dark: #86efac;
    }

    [data-theme="light"] {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --text-secondary: var(--text-secondary-light);
      --hairline: var(--hairline-light);
      --accent: var(--accent-light);
    }

    [data-theme="dark"] {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --text-secondary: var(--text-secondary-dark);
      --hairline: var(--hairline-dark);
      --accent: var(--accent-dark);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .fallback-icon {
      display: none;
      font-size: 16px;
    }

    .material-symbols-outlined:empty + .fallback-icon {
      display: inline;
    }

    /* ===================
       Theme toggle — single icon, no switch.
    ====================== */
    .theme-toggle-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 36px;
      height: 36px;
      border: 1px solid var(--hairline);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      transition: border-color 0.15s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--text);
    }

    .theme-toggle-btn .material-symbols-outlined {
      font-size: 20px;
    }

    /* ===================
       Page layout.
    ====================== */
    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .masthead {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      padding: 0 0.5rem;
    }

    .kicker {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--text-secondary);
      margin-top: 3.5rem;
    }

    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(2.75rem, 8vw, 4.5rem);
      letter-spacing: -0.01em;
      line-height: 1.05;
      margin: 0.6rem 0 1.5rem;
      color: var(--text);
    }

    .wordmark .accent {

    }

    .hairline {
      border: none;
      border-top: 1px solid var(--hairline);

    .deck {

    /* ===================
       Search / paste fields.
    ====================== */
    .field-row {

      gap: 0.6rem;
      max-width: 480px;

    #search-form {

      background: transparent;
      color: var(--text);
      display: flex;

      justify-content: center;
      cursor: pointer;

    .icon-btn:hover {

    .icon-btn:focus-visible {

    ====================== */

      justify-content: flex-end;

      margin-top: 2.5rem;

    .results-toolbar[hidden] {

    .results-toolbar select {

      font-size: 0.78rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--hairline);
      padding: 0.35rem 0.5rem;

    @media (max-width: 480px) {

        margin-right: 2.75rem;

    /* ===================
       Suggested videos + watch history tabs.
    ====================== */
    .suggested-section {

    .suggested-heading {

      border: none;
      padding: 0.6rem 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;

    /* ===================
       Search results — full page width.
    ====================== */
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2.25rem 1.75rem;
      margin-top: 1.25rem;
      margin-bottom: 2rem;

    .search-result {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;

    .search-result-thumb {

    .search-result img {
      width: 100%;

    .search-result:hover .search-result-title {

    .search-result-channel {
      font-size: 0.72rem;
      font-weight: 600;

    .search-result-meta {

    .search-status {
      grid-column: 1 / -1;

    @media (max-width: 480px) {
      .field-row {
        gap: 0.4rem;
      }

    /* ===================
       Footer.
    ====================== */
    .page-footer {
      margin-top: 4.5rem;
      text-align: center;
    }

    /* ===================
       Video modal (full + minimized/draggable PiP).
    ====================== */
    .video-modal[hidden] {
      display: none;
    }

    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .video-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
    }

    .video-modal.minimized {
      align-items: flex-end;
      justify-content: flex-end;

    .video-modal.minimized .video-modal-backdrop {

    .video-modal-panel {
      position: relative;
      z-index: 1;

      position: fixed;
      width: min(300px, calc(100vw - 32px));
      right: 16px;
      bottom: 16px;
      touch-action: none;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      cursor: grab;
    }

    .video-modal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.8rem;
      border-bottom: 1px solid var(--hairline);
      background: var(--bg);
    }

    .video-modal-title {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 0.85rem;
      color: var(--text);
      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .video-modal-actions {
      display: flex;
      gap: 0.4rem;

    }

    .video-modal-actions button {
      width: 26px;
      height: 26px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-modal-actions button:hover {

    }

    .video-modal-actions .material-symbols-outlined {
      font-size: 16px;
    }

    .video-modal-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-modal-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-modal-catcher {
      position: absolute;
      inset: 0;
      display: none;
    }

    .video-modal.minimized .video-modal-catcher {
      display: block;
    }
  </style>

  <script>
    /**
     * Constants.
     */
    const VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;
    const PLAYLIST_ID_RE = /^[A-Za-z0-9_-]{13,42}$/;
    const MAX_START_SECONDS = 86400;
    const PROGRESS_KEY_PREFIX = 'cleantube:progress:';
    const PROGRESS_MAX_AGE_MS = 1000 * 60 * 60 * 24 * 30; // 30 days
    const PROGRESS_SAVE_INTERVAL_MS = 5000;

    /**
     * Theme: single icon that reflects (and toggles) the active theme.
     */
    function updateThemeIcon(theme) {
      const iconEl = document.getElementById('theme-icon');
      const fallbackEl = document.getElementById('theme-icon-fallback');
      if (!iconEl || !fallbackEl) return;

      if (theme === 'dark') {
        iconEl.textContent = 'dark_mode';
        fallbackEl.textContent = '🌙';
      } else {
        iconEl.textContent = 'light_mode';
        fallbackEl.textContent = '☀️';
      }
    }

    function setThemeFromPreference() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');

      document.documentElement.setAttribute('data-theme', theme);
      updateThemeIcon(theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';

      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeIcon(next);
    }

    function setupThemeToggleButton() {
      const btn = document.getElementById('theme-toggle-btn');
      if (!btn) return;
      btn.addEventListener('click', toggleTheme);
    }

    /**
     * Parse YouTube start times:
     * 60, 60s, 1m30s, 1h2m3s.
     */
    function parseStartTime(raw) {
      if (raw == null) return 0;

      const s = String(raw).trim().toLowerCase();
      if (!s) return 0;

      if (/^\d+$/.test(s)) {
        const n = parseInt(s, 10);
        return isFinite(n) && n > 0 ? Math.min(n, MAX_START_SECONDS) : 0;
      }

      const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
      if (!m) return 0;

      const h = m[1] ? parseInt(m[1], 10) : 0;
      const mn = m[2] ? parseInt(m[2], 10) : 0;
      const sc = m[3] ? parseInt(m[3], 10) : 0;

      if (!(h || mn || sc)) return 0;

      const total = h * 3600 + mn * 60 + sc;
      return total > 0 ? Math.min(total, MAX_START_SECONDS) : 0;
    }

    /**
     * Extract start time from URL params or hash.
     */
    function extractStartFromUrl(url) {
      const raw =
        url.searchParams.get('t') ||
        url.searchParams.get('start') ||
        url.searchParams.get('start_seconds');

      const n = parseStartTime(raw);
      if (n) return n;

      const hash = (url.hash || '').replace(/^#/, '');

      if (hash) {
        const hp = new URLSearchParams(hash);
        const hraw = hp.get('t') || hp.get('start');

        if (hraw) return parseStartTime(hraw);

        const bare = parseStartTime(hash);
        if (bare) return bare;
      }

      return 0;
    }

    /**
     * Accept many YouTube formats and return:
     * { videoId?, playlistId?, startSeconds? }
     */
    function parseInput(input) {
      if (input == null) return null;

      const trimmed = String(input).trim();
      if (!trimmed) return null;

      // Plain 11-character YouTube video ID.
      if (VIDEO_ID_RE.test(trimmed)) {
        return { videoId: trimmed };
      }

      // Plain playlist ID.
      if (/^(PL|UU|LL|FL|RD|OL|UL|PU|TL)[A-Za-z0-9_-]{10,}$/.test(trimmed) && PLAYLIST_ID_RE.test(trimmed)) {
        return { playlistId: trimmed };
      }

      let url;

      try {
        const candidate = /^[a-z]+:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
        url = new URL(candidate);
      } catch (e) {
        try {
          const decoded = decodeURIComponent(trimmed);

          if (decoded && decoded !== trimmed) {
            return parseInput(decoded);
          }
        } catch (_) {}

        return null;
      }

      const host = url.hostname.toLowerCase().replace(/^www\./, '');
      const params = url.searchParams;

      // youtu.be/<id>
      if (host === 'youtu.be') {
        const shortId = url.pathname.replace(/^\/+/, '').split('/')[0] || '';
        const out = {};

        if (VIDEO_ID_RE.test(shortId)) {
          out.videoId = shortId;
        }

        const list = params.get('list');
        if (list && PLAYLIST_ID_RE.test(list)) {
          out.playlistId = list;
        }

        const start = extractStartFromUrl(url);
        if (start && out.videoId) {
          out.startSeconds = start;
        }

        return (out.videoId || out.playlistId) ? out : null;
      }

      const isYouTube =
        host === 'youtube.com' ||
        host === 'm.youtube.com' ||
        host === 'music.youtube.com' ||
        host === 'youtube-nocookie.com' ||
        host === 'gaming.youtube.com';

      if (isYouTube) {
        const path = url.pathname;
        const out = {};

        if (path === '/watch' || path === '/watch/') {
          const videoId = params.get('v');
          if (videoId && VIDEO_ID_RE.test(videoId)) {
            out.videoId = videoId;
          }

          const list = params.get('list');
          if (list && PLAYLIST_ID_RE.test(list)) {
            out.playlistId = list;
          }
        } else if (path.indexOf('/shorts/') === 0) {
          const shortsId = path.split('/')[2] || '';
          if (VIDEO_ID_RE.test(shortsId)) {
            out.videoId = shortsId;
          }
        } else if (path.indexOf('/embed/') === 0) {
          const embedId = path.split('/')[2] || '';

          if (embedId === 'videoseries') {
            const embedList = params.get('list');
            if (embedList && PLAYLIST_ID_RE.test(embedList)) {
              out.playlistId = embedList;
            }
          } else if (VIDEO_ID_RE.test(embedId)) {
            out.videoId = embedId;

            const embedList = params.get('list');
            if (embedList && PLAYLIST_ID_RE.test(embedList)) {
              out.playlistId = embedList;
            }
          }
        } else if (path.indexOf('/live/') === 0) {
          const liveId = path.split('/')[2] || '';
          if (VIDEO_ID_RE.test(liveId)) {
            out.videoId = liveId;
          }
        } else if (path.indexOf('/v/') === 0) {
          const oldId = path.split('/')[2] || '';
          if (VIDEO_ID_RE.test(oldId)) {
            out.videoId = oldId;
          }
        } else if (path === '/playlist' || path === '/playlist/') {
          const playlistId = params.get('list');
          if (playlistId && PLAYLIST_ID_RE.test(playlistId)) {
            out.playlistId = playlistId;
          }
        }

        if (out.videoId) {
          const start = extractStartFromUrl(url);
          if (start) {
            out.startSeconds = start;
          }
        }

        return (out.videoId || out.playlistId) ? out : null;
      }

      const listOnly = params.get('list');
      if (listOnly && PLAYLIST_ID_RE.test(listOnly)) {
        return { playlistId: listOnly };
      }

      return null;
    }

    /**
     * Query the /api/search serverless function (which holds the YouTube
     * Data API key server-side via the YOUTUBE_API_KEY env var) for videos
     * matching a search term. Returns an array of
     * { videoId, title, channelTitle, thumbnailUrl, publishedAt, viewCount }.
     */
    async function searchYouTubeVideos(query) {
      const response = await fetch('/api/search?q=' + encodeURIComponent(query));
      const data = await response.json().catch(function () { return null; });

      if (!response.ok) {
        const reason = data && data.error ? data.error : response.statusText;
        throw new Error(reason || 'YouTube search failed.');
      }

      return (data && Array.isArray(data.results)) ? data.results : [];
    }

    /**
     * Formatting helpers for search result metadata.
     */
    function formatViewCount(count) {
      if (count == null || isNaN(count)) return '';

      if (count >= 1e9) return (count / 1e9).toFixed(1).replace(/\.0$/, '') + 'B views';
      if (count >= 1e6) return (count / 1e6).toFixed(1).replace(/\.0$/, '') + 'M views';
      if (count >= 1e3) return (count / 1e3).toFixed(1).replace(/\.0$/, '') + 'K views';

      return count + ' views';
    }

    function formatDuration(iso) {
      if (!iso) return '';

      const match = iso.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
      if (!match) return '';

      const hours = parseInt(match[1] || '0', 10);
      const minutes = parseInt(match[2] || '0', 10);
      const seconds = parseInt(match[3] || '0', 10);

      if (!hours && !minutes && !seconds) return '';

      const paddedSeconds = String(seconds).padStart(2, '0');

      if (hours) {
        return hours + ':' + String(minutes).padStart(2, '0') + ':' + paddedSeconds;
      }

      return minutes + ':' + paddedSeconds;
    }

    function formatRelativeDate(iso) {
      if (!iso) return '';

      const date = new Date(iso);
      if (isNaN(date.getTime())) return '';

      const diffDays = Math.floor((Date.now() - date.getTime()) / (1000 * 60 * 60 * 24));

      if (diffDays < 1) return 'today';
      if (diffDays === 1) return '1 day ago';
      if (diffDays < 30) return diffDays + ' days ago';

      const diffMonths = Math.floor(diffDays / 30);
      if (diffMonths < 12) return diffMonths + (diffMonths === 1 ? ' month ago' : ' months ago');

      const diffYears = Math.floor(diffMonths / 12);
      return diffYears + (diffYears === 1 ? ' year ago' : ' years ago');
    }

    /**
     * Sorting for the results grid. 'relevance' keeps the API's own order.
     */
    let currentResults = [];

    function sortResults(results, sortBy) {
      const copy = results.slice();

      if (sortBy === 'views') {
        copy.sort(function (a, b) { return (b.viewCount || 0) - (a.viewCount || 0); });
      } else if (sortBy === 'newest') {
        copy.sort(function (a, b) { return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0); });
      } else if (sortBy === 'oldest') {
        copy.sort(function (a, b) { return new Date(a.publishedAt || 0) - new Date(b.publishedAt || 0); });
      }

      return copy;
    }

    function setupSortControl() {
      const select = document.getElementById('sort-select');
      if (!select) return;

      select.addEventListener('change', function () {
        renderSearchResults(sortResults(currentResults, select.value));
      });
    }

    /**
     * Replace the search results grid with a single status line (or clear it).
     */
    function setSearchStatus(message) {
      const grid = document.getElementById('search-results');
      if (!grid) return;

      grid.innerHTML = '';
      if (!message) return;

      const status = document.createElement('p');
      status.className = 'search-status';
      status.textContent = message;
      grid.appendChild(status);
    }

    function setToolbarVisible(visible) {
      const toolbar = document.getElementById('results-toolbar');
      if (!toolbar) return;
      toolbar.hidden = !visible;
    }

    /**
     * Build a single clickable video card. `result.historyMeta`, if set,
     * replaces the usual "views · uploaded" line (used by the watch
     * history panel to show "watched X ago" instead).
     */
    function buildResultCard(result) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'search-result';
      card.setAttribute('aria-label', 'Watch: ' + result.title);

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'search-result-thumb';

      const thumb = document.createElement('img');
      thumb.src = result.thumbnailUrl;
      thumb.alt = '';
      thumb.loading = 'lazy';
      thumbWrap.appendChild(thumb);

      const durationText = formatDuration(result.duration);
      if (durationText) {
        const durationPill = document.createElement('span');
        durationPill.className = 'search-result-duration';
        durationPill.textContent = durationText;
        thumbWrap.appendChild(durationPill);
      }

      card.appendChild(thumbWrap);

      const title = document.createElement('span');
      title.className = 'search-result-title';
      title.textContent = result.title;
      card.appendChild(title);

      const channel = document.createElement('span');
      channel.className = 'search-result-channel';
      channel.textContent = result.channelTitle;
      card.appendChild(channel);

      const metaParts = [];
      if (result.historyMeta) {
        metaParts.push(result.historyMeta);
      } else {
        if (result.viewCount != null) metaParts.push(formatViewCount(result.viewCount));
        if (result.publishedAt) metaParts.push(formatRelativeDate(result.publishedAt));
      }

      if (metaParts.length) {
        const meta = document.createElement('span');
        meta.className = 'search-result-meta';
        meta.textContent = metaParts.join(' · ');
        card.appendChild(meta);
      }

      card.addEventListener('click', function () {
        openVideoModal(
          { videoId: result.videoId },
          {
            title: result.title,
            channelTitle: result.channelTitle,
            thumbnailUrl: result.thumbnailUrl,
            duration: result.duration,
          }
        );
      });

      return card;
    }

    /**
     * Render a list of results into any grid container, or a status
     * message if the list is empty.
     */
    function renderResultsGrid(grid, results, emptyMessage) {
      if (!grid) return;

      grid.innerHTML = '';

      if (!results.length) {
        const status = document.createElement('p');
        status.className = 'search-status';
        status.textContent = emptyMessage;
        grid.appendChild(status);
        return;
      }

      results.forEach(function (result) {
        grid.appendChild(buildResultCard(result));
      });
    }

    /**
     * Render search results as clickable video cards.
     */
    function renderSearchResults(results) {
      renderResultsGrid(document.getElementById('search-results'), results, 'No videos found.');
    }

    /**
     * Run a search and render the results. Guards against out-of-order
     * responses (e.g. a fast-typed later query resolving before an earlier
     * one) by only applying the response that matches the latest request.
     */
    let searchRequestId = 0;

    async function runSearch(query) {
      if (!query) return;

      const requestId = ++searchRequestId;

      setSuggestedSectionVisible(false);
      setToolbarVisible(false);
      setSearchStatus('Searching…');

      try {
        const results = await searchYouTubeVideos(query);
        if (requestId !== searchRequestId) return;

        currentResults = results;
        const select = document.getElementById('sort-select');
        renderSearchResults(sortResults(currentResults, select ? select.value : 'relevance'));
        setToolbarVisible(currentResults.length > 0);
      } catch (err) {
        if (requestId !== searchRequestId) return;
        setSearchStatus('Search failed: ' + err.message);
      }
    }

    /**
     * Wire up the search form: search on submit, and search-as-you-type
     * with a 1500ms debounce so we're not firing a request per keystroke.
     */
    const SEARCH_DEBOUNCE_MS = 1500;
    let searchDebounceTimer = null;

    function setupSearchForm() {
      const form = document.getElementById('search-form');
      const input = document.getElementById('search-input');

      if (!form || !input) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearTimeout(searchDebounceTimer);
        runSearch(input.value.trim());
      });

      input.addEventListener('input', function () {
        clearTimeout(searchDebounceTimer);

        const query = input.value.trim();

        if (!query) {
          searchRequestId++; // invalidate any in-flight request
          currentResults = [];
          setToolbarVisible(false);
          setSearchStatus('');
          setSuggestedSectionVisible(true);
          return;
        }

        searchDebounceTimer = setTimeout(function () {
          runSearch(query);
        }, SEARCH_DEBOUNCE_MS);
      });
    }

    /**
     * Watch history — stored client-side in localStorage, no sign-up, no
     * server-side tracking. Capped and deduped by video, most recent first.
     */
    const HISTORY_KEY = 'cleantube:history';
    const HISTORY_MAX = 24;

    function getWatchHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function addToWatchHistory(entry) {
      if (!entry || !entry.videoId) return;

      try {
        const history = getWatchHistory().filter(function (h) { return h.videoId !== entry.videoId; });

        history.unshift({
          videoId: entry.videoId,
          title: entry.title || '',
          channelTitle: entry.channelTitle || '',
          thumbnailUrl: entry.thumbnailUrl || '',
          duration: entry.duration || null,
          watchedAt: Date.now(),
        });

        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_MAX)));
      } catch (_) {}
    }

    function clearWatchHistory() {
      try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
    }

    /**
     * Look up a single video's metadata (used to backfill title/channel/
     * thumbnail for videos opened via pasted link, so watch history shows
     * more than just an ID).
     */
    async function fetchVideoInfo(videoId) {
      const response = await fetch('/api/search?id=' + encodeURIComponent(videoId));
      const data = await response.json().catch(function () { return null; });
      if (!response.ok || !data || !data.result) return null;
      return data.result;
    }

    async function recordWatch(videoId, meta) {
      if (meta && meta.title) {
        addToWatchHistory({
          videoId: videoId,
          title: meta.title,
          channelTitle: meta.channelTitle,
          thumbnailUrl: meta.thumbnailUrl,
          duration: meta.duration,
        });
        refreshHistoryPanelIfVisible();
        return;
      }

      try {
        const info = await fetchVideoInfo(videoId);
        if (!info) return;

        addToWatchHistory(info);
        refreshHistoryPanelIfVisible();

        // Backfill the modal title bar if still on this same video.
        if (currentVideoId === videoId) {
          const titleEl = document.getElementById('video-modal-title');
          if (titleEl && !titleEl.textContent) titleEl.textContent = info.title;
        }
      } catch (_) {}
    }

    /**
     * Suggested videos: seeded from the most recently watched channel when
     * history exists, falling back to YouTube's own "trending now" chart
     * for first-time visitors. Cached client-side for an hour so repeat
     * visits in a session don't re-spend search quota.
     */
    const SUGGESTED_CACHE_KEY = 'cleantube:suggested-cache';
    const SUGGESTED_CACHE_MS = 60 * 60 * 1000; // 1 hour
    let lastSuggestedHeading = 'Suggested for you';

    function getSuggestedCache(seedKey) {
      try {
        const raw = localStorage.getItem(SUGGESTED_CACHE_KEY);
        if (!raw) return null;

        const data = JSON.parse(raw);
        if (!data || data.seedKey !== seedKey) return null;
        if (Date.now() - (data.cachedAt || 0) > SUGGESTED_CACHE_MS) return null;

        return { results: data.results, heading: data.heading };
      } catch (_) {
        return null;
      }
    }

    function setSuggestedCache(seedKey, results, heading) {
      try {
        localStorage.setItem(SUGGESTED_CACHE_KEY, JSON.stringify({
          seedKey: seedKey,
          results: results,
          heading: heading,
          cachedAt: Date.now(),
        }));
      } catch (_) {}
    }

    async function fetchTrending() {
      const response = await fetch('/api/search?trending=1');
      const data = await response.json().catch(function () { return null; });

      if (!response.ok) {
        throw new Error((data && data.error) || 'Failed to load trending videos.');
      }

      return (data && Array.isArray(data.results)) ? data.results : [];
    }

    async function loadSuggestions() {
      const container = document.getElementById('suggested-results');
      const heading = document.getElementById('suggested-heading');
      if (!container) return;

      const history = getWatchHistory();
      const seedChannel = history.length ? history[0].channelTitle : null;
      const seedKey = seedChannel || 'trending';

      const cached = getSuggestedCache(seedKey);
      if (cached) {
        lastSuggestedHeading = cached.heading;
        if (heading) heading.textContent = cached.heading;
        renderResultsGrid(container, cached.results, "Couldn't load suggestions.");
        return;
      }

      renderResultsGrid(container, [], 'Loading suggestions…');

      try {
        let results = [];
        let headingText = 'Trending now';

        if (seedChannel) {
          const watchedIds = new Set(history.map(function (h) { return h.videoId; }));
          const channelResults = await searchYouTubeVideos(seedChannel).catch(function () { return []; });
          results = channelResults.filter(function (r) { return !watchedIds.has(r.videoId); }).slice(0, 12);
          if (results.length) headingText = 'Because you watched ' + seedChannel;
        }

        if (!results.length) {
          results = await fetchTrending();
          headingText = 'Trending now';
        }

        lastSuggestedHeading = headingText;
        if (heading) heading.textContent = headingText;
        renderResultsGrid(container, results, "Couldn't load suggestions.");
        setSuggestedCache(seedKey, results, headingText);
      } catch (err) {
        renderResultsGrid(container, [], "Couldn't load suggestions.");
      }
    }

    function setSuggestedSectionVisible(visible) {
      const section = document.getElementById('suggested-section');
      if (section) section.hidden = !visible;
    }

    /**
     * Render the watch history panel (most recent first).
     */
    function renderHistoryPanel() {
      const container = document.getElementById('history-results');
      const clearBtn = document.getElementById('clear-history-btn');
      const history = getWatchHistory();

      renderResultsGrid(
        container,
        history.map(function (h) {
          return {
            videoId: h.videoId,
            title: h.title,
            channelTitle: h.channelTitle,
            thumbnailUrl: h.thumbnailUrl,
            duration: h.duration,
            historyMeta: 'Watched ' + formatRelativeDate(new Date(h.watchedAt).toISOString()),
          };
        }),
        "You haven't watched anything yet."
      );

      if (clearBtn) clearBtn.hidden = !history.length;
    }

    function refreshHistoryPanelIfVisible() {
      const panel = document.getElementById('history-panel');
      if (panel && !panel.hidden) renderHistoryPanel();
    }

    /**
     * Tabs between the "Suggested" and "History" panels.
     */
    function setupGridTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      const clearBtn = document.getElementById('clear-history-btn');
      const suggestedPanel = document.getElementById('suggested-panel');
      const historyPanel = document.getElementById('history-panel');
      const heading = document.getElementById('suggested-heading');

      if (!tabs.length) return;

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('is-active'); });
          tab.classList.add('is-active');

          const target = tab.getAttribute('data-tab');
          if (suggestedPanel) suggestedPanel.hidden = target !== 'suggested';
          if (historyPanel) historyPanel.hidden = target !== 'history';

          if (target === 'history') {
            if (heading) heading.textContent = 'Watch history';
            renderHistoryPanel();
          } else {
            if (heading) heading.textContent = lastSuggestedHeading;
            if (clearBtn) clearBtn.hidden = true;
          }
        });
      });

      if (clearBtn) {
        clearBtn.addEventListener('click', function () {
          clearWatchHistory();
          renderHistoryPanel();
        });
      }
    }

    /**
     * Handle the "paste a link" form: parse it and play it in the modal.
     */
    function setupPurifyForm() {
      const form = document.getElementById('purify-form');
      const input = document.getElementById('youtube-input');

      if (!form || !input) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const parsed = parseInput(input.value);

        if (!parsed) {
          alert('Please enter a valid YouTube video or playlist URL.');
          return;
        }

        openVideoModal(parsed, null);
      });
    }

    /**
     * Best-effort lock-screen metadata via the Media Session API.
     *
     * Note: this cannot make YouTube's embedded player keep playing audio
     * once mobile Safari is backgrounded — that player lives in a
     * cross-origin iframe we don't control, and iOS suspends background
     * tabs' media outside of a handful of first-party cases. This just adds
     * the metadata hook for the cases where the browser does surface it.
     */
    function updateMediaSession(title) {
      if (!('mediaSession' in navigator)) return;

      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || 'CleanTube',
          artist: 'CleanTube',
        });
      } catch (_) {}
    }

    /**
     * Resume-playback persistence (per video, in localStorage).
     */
    function getSavedProgress(videoId) {
      try {
        const raw = localStorage.getItem(PROGRESS_KEY_PREFIX + videoId);
        if (!raw) return 0;

        const data = JSON.parse(raw);
        if (!data || typeof data.seconds !== 'number') return 0;
        if (Date.now() - (data.savedAt || 0) > PROGRESS_MAX_AGE_MS) return 0;

        // Don't "resume" from right near the end — just start over.
        return data.seconds > 5 ? Math.floor(data.seconds) : 0;
      } catch (_) {
        return 0;
      }
    }

    function saveProgress(videoId, seconds) {
      if (!videoId || !isFinite(seconds) || seconds < 0) return;

      try {
        localStorage.setItem(
          PROGRESS_KEY_PREFIX + videoId,
          JSON.stringify({ seconds: seconds, savedAt: Date.now() })
        );
      } catch (_) {}
    }

    function clearProgress(videoId) {
      try { localStorage.removeItem(PROGRESS_KEY_PREFIX + videoId); } catch (_) {}
    }

    function saveCurrentProgress() {
      if (!ytPlayer || !currentVideoId || typeof ytPlayer.getCurrentTime !== 'function') return;

      try {
        saveProgress(currentVideoId, ytPlayer.getCurrentTime());
      } catch (_) {}
    }

    let progressTimerId = null;

    function startProgressTimer() {
      if (progressTimerId) return;
      progressTimerId = setInterval(saveCurrentProgress, PROGRESS_SAVE_INTERVAL_MS);
    }

    function stopProgressTimer() {
      if (!progressTimerId) return;
      clearInterval(progressTimerId);
      progressTimerId = null;
    }

    /**
     * YouTube IFrame Player API — loaded lazily on first video open, then
     * reused for every subsequent video so the same iframe keeps playing
     * across minimize/restore.
     */
    let ytPlayer = null;
    let ytPlayerReady = false;
    let pendingLoad = null;
    let currentVideoId = null;

    function loadYouTubeIframeApi() {
      if (window.YT && window.YT.Player) {
        initYtPlayer();
        return;
      }

      if (document.getElementById('youtube-iframe-api')) return;

      window.onYouTubeIframeAPIReady = initYtPlayer;

      const script = document.createElement('script');
      script.id = 'youtube-iframe-api';
      script.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(script);
    }

    function initYtPlayer() {
      ytPlayer = new YT.Player('player-target', {
        host: 'https://www.youtube-nocookie.com',
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: function () {
            ytPlayerReady = true;
            if (pendingLoad) {
              applyLoad(pendingLoad);
              pendingLoad = null;
            }
          },
          onStateChange: handlePlayerStateChange,
        },
      });
    }

    function handlePlayerStateChange(event) {
      if (event.data === 1) {
        // playing
        startProgressTimer();
      } else {
        stopProgressTimer();
        saveCurrentProgress();
      }

      if (event.data === 0 && currentVideoId) {
        // ended
        clearProgress(currentVideoId);
      }
    }

    function applyLoad(parsed) {
      currentVideoId = parsed.videoId || null;

      if (parsed.playlistId) {
        ytPlayer.loadPlaylist({ list: parsed.playlistId, listType: 'playlist' });
        return;
      }

      if (parsed.videoId) {
        const resumeSeconds = getSavedProgress(parsed.videoId);
        const startSeconds = (parsed.startSeconds && parsed.startSeconds > 0) ? parsed.startSeconds : resumeSeconds;
        ytPlayer.loadVideoById({ videoId: parsed.videoId, startSeconds: startSeconds });
      }
    }

    function loadIntoPlayer(parsed) {
      if (!ytPlayerReady || !ytPlayer) {
        pendingLoad = parsed;
        loadYouTubeIframeApi();
        return;
      }

      applyLoad(parsed);
    }

    /**
     * Video modal: open (full), minimize (draggable PiP), restore, close.
     *
     * `meta` is optional: { title, channelTitle, thumbnailUrl, duration }.
     * Search results already carry it; pasted links don't, so it's
     * backfilled asynchronously via a single-video lookup (see
     * recordWatch) once the video starts.
     */
    function openVideoModal(parsed, meta) {
      if (!parsed || (!parsed.videoId && !parsed.playlistId)) return;

      const modal = document.getElementById('video-modal');
      const titleEl = document.getElementById('video-modal-title');
      if (!modal) return;

      if (titleEl) {
        titleEl.textContent = (meta && meta.title) || '';
      }

      restoreVideoModal();
      modal.hidden = false;

      loadIntoPlayer(parsed);
      updateMediaSession(meta && meta.title);

      if (parsed.videoId) {
        recordWatch(parsed.videoId, meta);
      }
    }

    function closeVideoModal() {
      saveCurrentProgress();
      stopProgressTimer();

      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (_) {}
      }

      const modal = document.getElementById('video-modal');
      if (modal) modal.hidden = true;

      restoreVideoModal();
      currentVideoId = null;
    }

    function minimizeVideoModal() {
      const modal = document.getElementById('video-modal');
      if (!modal) return;
      modal.classList.add('minimized');
    }

    function restoreVideoModal() {
      const modal = document.getElementById('video-modal');
      const panel = document.getElementById('video-modal-panel');
      if (!modal || !panel) return;

      modal.classList.remove('minimized');
      panel.style.left = '';
      panel.style.top = '';
      panel.style.right = '';
      panel.style.bottom = '';
    }

    function setupVideoModalControls() {
      const minimizeBtn = document.getElementById('video-minimize-btn');
      const closeBtn = document.getElementById('video-close-btn');
      const backdrop = document.querySelector('.video-modal-backdrop');

      if (minimizeBtn) {
        minimizeBtn.addEventListener('click', minimizeVideoModal);
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', closeVideoModal);
      }

      if (backdrop) {
        backdrop.addEventListener('click', closeVideoModal);
      }
    }

    /**
     * Dragging the minimized preview around the screen. Clicking it
     * (without dragging) restores the full modal. Action buttons are
     * excluded so they keep working normally.
     */
    function setupVideoModalDrag() {
      const panel = document.getElementById('video-modal-panel');
      const modal = document.getElementById('video-modal');
      if (!panel || !modal) return;

      let dragging = false;
      let moved = false;
      let offsetX = 0;
      let offsetY = 0;

      panel.addEventListener('pointerdown', function (event) {
        if (!modal.classList.contains('minimized')) return;
        if (event.target.closest('.video-modal-actions')) return;

        dragging = true;
        moved = false;
        const rect = panel.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        try { panel.setPointerCapture(event.pointerId); } catch (_) {}
      });

      panel.addEventListener('pointermove', function (event) {
        if (!dragging) return;
        moved = true;

        const width = panel.offsetWidth;
        const height = panel.offsetHeight;
        let x = event.clientX - offsetX;
        let y = event.clientY - offsetY;

        x = Math.max(0, Math.min(window.innerWidth - width, x));
        y = Math.max(0, Math.min(window.innerHeight - height, y));

        panel.style.left = x + 'px';
        panel.style.top = y + 'px';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
      });

      panel.addEventListener('pointerup', function (event) {
        if (!dragging) return;
        dragging = false;

        if (!moved && event.target.closest('.video-modal-actions') == null) {
          restoreVideoModal();
        }
      });

      panel.addEventListener('pointercancel', function () {
        dragging = false;
      });
    }

    /**
     * Autostart on onload event: supports old ?v= links from the
     * previous purify-video.github.io site.
     */
    function init() {
      setThemeFromPreference();
      setupThemeToggleButton();
      setupSearchForm();
      setupPurifyForm();
      setupSortControl();
      setupVideoModalControls();
      setupVideoModalDrag();
      setupGridTabs();
      loadSuggestions();

      window.addEventListener('beforeunload', saveCurrentProgress);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') saveCurrentProgress();
      });

      const input = document.getElementById('youtube-input');
      const params = new URLSearchParams(window.location.search.substring(1));

      if (params.has('v')) {
        const originalValue = params.get('v');

        if (input && originalValue) {
          input.value = originalValue;
        }

        const parsed = parseInput(originalValue);

        if (parsed) {
          openVideoModal(parsed, null);
        }
      }
    }

    window.onload = init;
  </script>
</head>

<body>
  <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark mode">
    <span class="material-symbols-outlined" id="theme-icon" aria-hidden="true">light_mode</span>
    <span class="fallback-icon" id="theme-icon-fallback" aria-hidden="true">☀️</span>
  </button>

  <div class="page">
    <header class="masthead">
      <span class="kicker">Ad-free YouTube</span>
      <h1 class="wordmark">Clean<span class="accent">Tube</span></h1>
      <hr class="hairline" />
